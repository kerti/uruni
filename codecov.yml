# Generated code is not reviewed line by line, so measuring it measures sqlc.
# Everything below carries "// Code generated by sqlc. DO NOT EDIT." — the only
# hand-written file in internal/store is queries_ascii_test.go.
#
# Leaving it in was actively misleading, not just noisy. Go instruments only the
# package under test, and internal/store has no tests of its own: the db tests
# call store.New(db).CreateTransaction(...) hundreds of times, and every one of
# those statements is counted against internal/db. So the package reported 0.0%
# while being one of the most exercised in the repo. M2 added ~1,500 such lines
# and Codecov read it as -48.52% on a branch whose real coverage went *up* —
# 74.4% against main's 67.45% once these files are out of the denominator.
# Every future schema slice would have made that worse, which is how a project
# learns to ignore its own coverage signal.
#
# Note the single star: Codecov compiles "**/*.sql.go" to ".*/[^/]*\.sql\.go",
# which requires a subdirectory and would silently match none of these — they
# sit directly in internal/store/. Re-check with Codecov's validator after any
# edit here: `curl -X POST --data-binary @codecov.yml https://codecov.io/validate`
ignore:
  - "internal/store/*.sql.go"
  - "internal/store/models.go"
  - "internal/store/querier.go"
  - "internal/store/db.go"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  backend:
    paths:
      - "!web/"
  frontend:
    paths:
      - "web/"

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
