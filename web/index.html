<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes the env(safe-area-inset-*) values in
         Shell.tsx non-zero on a notched phone; without it the shell's header
         and bottom action pad against nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5D50" />
    <!-- The manifest link itself is injected by vite-plugin-pwa (M6.7), which
         generates manifest.webmanifest from the manifest block in
         vite.config.ts. iOS ignores the manifest's icons, so it gets its own
         link and standalone hints here. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Uruni" />
    <title>Uruni</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
