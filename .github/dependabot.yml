# Strict up-to-date protection and human-only merges make every open PR rebase
# and re-run CI after each merge, so minor and patch bumps arrive as one PR per
# ecosystem; majors stay separate for review. Lockstep groups come first:
# Dependabot puts a dependency in the first group it matches.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      gomod-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # Families that must move in lockstep, so a bump arrives as one PR
      # rather than several that each fail CI alone. Names are explicit, not
      # "react*": that would sweep in react-router-dom and plugin-react.
      vitest:
        # @vitest/coverage-v8 must match vitest exactly.
        patterns: ["vitest", "@vitest/*"]
      tailwind:
        # The Vite plugin and the core ship as a pair.
        patterns: ["tailwindcss", "@tailwindcss/*"]
      react:
        # react-dom requires the exact same react; the types follow them.
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # init, autobuild and analyze are one action at one version: CodeQL
      # refuses to run with them split ("Loaded a configuration file for
      # version X, but running version Y"), so they must bump in one PR.
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # Images are pinned as tag@sha256 (Dockerfile, compose); these keep the digests
  # moving. A golang bump must ride with go.mod's toolchain line
  # (TestDockerfileGoMatchesToolchain): amend the Dependabot PR with the new
  # toolchain line rather than ignoring golang, so security patches still land.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
