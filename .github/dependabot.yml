version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # init, autobuild and analyze are one action at one version: CodeQL
      # refuses to run with them split ("Loaded a configuration file for
      # version X, but running version Y"), so they must bump in one PR.
      codeql-action:
        patterns: ["github/codeql-action*"]
