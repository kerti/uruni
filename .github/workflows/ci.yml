# CI — runs on every PR and push to main. Local mirror: `make check`.
# Every action is pinned to a commit SHA: a tag like `v7` is mutable, and a
# compromised one runs with this workflow's token. The trailing `# vX.Y.Z`
# comment is what Dependabot reads and rewrites when it bumps the pin — keep it.
name: CI

on:
  push:
    branches: [main]
  # No branches filter: the filter matches the PR's *base*, so `[main]` left
  # every PR into a long-lived branch (e.g. epic/*) completely unchecked.
  pull_request:

permissions:
  contents: read

env:
  # Keep in lockstep with the `version: "2"` schema in .golangci.yml and with
  # whatever `make lint` runs locally — that lockstep IS `make check`'s promise
  # that green-locally means green-in-CI (ADR-020). golangci-lint-action v8
  # drives golangci-lint v2; do not drop back to action v6 (v1 only).
  GOLANGCI_VERSION: v2.13.2

jobs:
  # The Makefile, hooks and workflows were deliberately written before the
  # scaffold (ADR-019), so between now and M1 there is no go.mod and no web/.
  # Rather than let `main` sit red — which would break "never tag a red main"
  # (ROADMAP) — each job waits until the tree it lints actually exists. Once M1
  # lands, both flags flip to true permanently and this gate becomes inert.
  preflight:
    name: Detect what exists (CI)
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        run: |
          if [ -f go.mod ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No go.mod yet — backend job skipped until the M1 scaffold lands."
          fi
          if [ -f web/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No web/package.json yet — frontend job skipped until the M1 scaffold lands."
          fi

  backend:
    name: Backend (lint + test)
    needs: preflight
    if: needs.preflight.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        # SHA of the v8 major — the v8-drives-v2 constraint above now lives in
        # the version comment, so read it before accepting a Dependabot bump.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          # The action's cache key is `golangci-lint.cache-<os>-<day>-<go.sum
          # hash>` — it carries neither the golangci-lint version nor the Go
          # version, so a cache written by one toolchain is restored for
          # another. Stale analysis facts then lose testing.Fatal's noreturn
          # property, and staticcheck reports SA5011 "possible nil pointer
          # dereference" against every correct `if x == nil { t.Fatal(...) }`
          # guard in the package — in files a PR never touched (#134/#162: 5
          # of 7 hits were in register_test.go, untouched since #118). It is
          # deterministic while the poisoned entry lives and self-heals only
          # when cache-invalidation-interval rotates it, which is exactly the
          # "green locally, red in CI" failure ADR-020 says `make check` must
          # never have. Lint runs in ~3s cold; the cache buys nothing worth
          # this.
          skip-cache: true
      - name: Test (race + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      # The token is an input, not step env: the action builds its own CLI
      # invocation and passes `-t` only from the input, so an env-only token left
      # every upload tokenless. Codecov rejects those even from a public repo, and
      # the action does not fail the build on an upload error — so this was silent.
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (lint + typecheck + test + build)
    needs: preflight
    if: needs.preflight.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Resolved from the repo root: `defaults.run.working-directory` applies
          # to `run:` steps only, never to an action's own inputs.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          working-directory: web
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run build
