# Builds and boots the container image before a release does. Path-filtered on
# PRs, so it must never be a required check (a skipped required check blocks
# the merge); main runs it on every push. Local mirror: `make stack-up-local`.
# Actions are SHA-pinned as in ci.yml; keep the trailing version comments.
name: Container image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - Caddyfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - embed.go
      - web/**
      - .github/workflows/image.yml

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boot:
    name: Image boots (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: uruni-ci:test
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      - name: Compose file validates
        env:
          URUNI_BASE_URL: https://uruni.example.com
          URUNI_TAG: ci
        run: docker compose -f docker-compose.yml config -q
      - name: Compose refuses to run without URUNI_TAG
        env:
          URUNI_BASE_URL: https://uruni.example.com
        run: |
          if docker compose -f docker-compose.yml config -q 2>err.txt; then
            echo "compose accepted an unset URUNI_TAG"; exit 1
          fi
          grep -q 'set URUNI_TAG in .env' err.txt
      - name: Boot on fresh volumes (hardened as in docker-compose.yml)
        run: |
          for v in data uploads backups; do docker volume create "uruni-ci-$v"; done
          docker run -d --name uruni-ci -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e URUNI_BASE_URL=http://localhost:8080 \
            -e URUNI_DB=/data/uruni.db \
            -e URUNI_UPLOADS_DIR=/uploads \
            -e URUNI_BACKUP_DIR=/backups \
            -v uruni-ci-data:/data -v uruni-ci-uploads:/uploads -v uruni-ci-backups:/backups \
            uruni-ci:test
      - name: Container becomes healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' uruni-ci)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "health status after 60s: $status"
          docker logs uruni-ci
          exit 1
      - name: Healthz answers ok and the boot dump landed
        run: |
          curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/healthz.json
          grep -q '"status":[[:space:]]*"ok"' /tmp/healthz.json
          # Distroless has no shell or ls: list the volume from a throwaway image.
          docker run --rm -v uruni-ci-backups:/b:ro busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e ls /b | tee /tmp/dumps.txt
          grep -Eq '^uruni-[0-9]{8}-[0-9]{6}-daily-fv[0-9]+-[0-9a-f]{12}\.zip$' /tmp/dumps.txt
      # `uruni rebuild` (#516) under the same hardening as the app: read-only root
      # filesystem, no capabilities, scratch and swap on the data volume. The
      # backup is made the way a person makes one (register, download) and the
      # app is stopped first, as rebuild requires. Two runs: the current
      # database is refused (its schema already matches), then a fresh data
      # volume is rebuilt from the zip.
      - name: Rebuild from a backup (hardened as in docker-compose.yml)
        run: |
          mkdir -p /tmp/rebuild-in && chmod 755 /tmp/rebuild-in
          curl -fsS -c /tmp/rebuild-jar -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.org","password":"ci-rebuild-password"}' \
            http://127.0.0.1:8080/api/register
          curl -fsS -b /tmp/rebuild-jar -o /tmp/rebuild-in/backup.zip http://127.0.0.1:8080/api/backup
          chmod 644 /tmp/rebuild-in/backup.zip
          docker stop uruni-ci
          docker volume create uruni-ci-data2
          rebuild() {
            docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
              -e URUNI_BASE_URL=http://localhost:8080 \
              -e URUNI_DB=/data/uruni.db \
              -e URUNI_UPLOADS_DIR=/uploads \
              -e URUNI_BACKUP_DIR=/backups \
              -v "$1":/data -v uruni-ci-uploads:/uploads -v uruni-ci-backups:/backups \
              -v /tmp/rebuild-in:/in:ro \
              uruni-ci:test "${@:2}"
          }
          if rebuild uruni-ci-data rebuild --from /in/backup.zip 2>/tmp/rebuild-err.txt; then
            echo "rebuild accepted a database that already has the current schema"; exit 1
          fi
          cat /tmp/rebuild-err.txt
          grep -q "already has this version's schema" /tmp/rebuild-err.txt
          rebuild uruni-ci-data2 rebuild --from /in/backup.zip | tee /tmp/rebuild-out.txt
          grep -q '^login carried over: ci@example.org' /tmp/rebuild-out.txt
          rebuild uruni-ci-data2 migrate status | tee /tmp/rebuild-status.txt
          grep -q 'schema: matches this version' /tmp/rebuild-status.txt
      - name: Container logs on failure
        if: failure()
        run: docker logs uruni-ci || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f uruni-ci || true
          docker volume rm uruni-ci-data uruni-ci-data2 uruni-ci-uploads uruni-ci-backups || true

  # No QEMU: the Dockerfile cross-compiles on the build platform and its only
  # target-platform stage is COPY, so this checks exactly that claim.
  arm64:
    name: Image builds (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64
