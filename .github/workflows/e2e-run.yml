# The one e2e runner (ADR-039), called by e2e.yml for both tiers. The tiers
# differ only in `grep`: smoke passes `@smoke`, the full run passes nothing.
# Local twin: `make e2e-ci` (and `make e2e` for a human at a terminal).
#
# No database service and no mock auth: the whole fixture is one SQLite file,
# and Playwright's global setup builds the binary and seeds it
# (web/e2e/global-setup.ts). Every worker runs its own instance with its own
# database, backup and uploads directories, so CI needs no .env.
#
# Actions are pinned by SHA with a `# vX.Y.Z` comment, as in ci.yml.
name: E2E run

on:
  workflow_call:
    inputs:
      tier:
        description: smoke or full - only labels the run and its artifact
        required: true
        type: string
      grep:
        description: Playwright --grep pattern; empty runs every spec
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
        # Not tier-specific: the check GitHub reports is `<caller job> / <this
        # job>`, so a tier in this name would give smoke and full different check
        # names and break e2e.yml's one-stable-name promise.
    name: Playwright
    runs-on: ubuntu-latest
        # The full tier takes about 2.5 minutes; this only stops a hung server from
        # holding a runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
            # The binary embeds web/dist, so the SPA is built before the suite builds
            # the binary (`make e2e` does this through web-build; e2e-ci does not).
      - run: npm run build
        working-directory: web
            # Most of this job's wall clock is setup, and the browser download is the
            # largest piece. The cache key is the installed runner's version, because
            # each Playwright release pins its own browser build. On a hit only the OS
            # packages are installed.
      - name: Read the Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
            # Both install steps go through apt, and a slow Ubuntu mirror once held
            # one for most of the job's 20 minutes (2026-10-26). apt now retries a
            # failed fetch and gives up on a stalled connection, and each step has
            # its own limit, so a bad mirror costs minutes, not the job.
      - name: Make apt fail fast
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-fail-fast > /dev/null
      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
            # Normally under a minute. One retry, as its own step. A step that hits
            # its limit does NOT take its sudo'd apt-get with it: on 2026-11-20 the
            # first attempt timed out and its apt-get, running as root, still held
            # the dpkg lock when the retry began, so the retry's dpkg failed at
            # once. The retry therefore stops whatever the first attempt left
            # running, waits for the lock to clear, and lets dpkg --configure -a
            # finish anything that was interrupted.
      - name: Install the browser's OS packages
        id: os-deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Install the browser's OS packages (retry)
        if: steps.os-deps.outcome == 'failure'
        working-directory: web
        timeout-minutes: 5
        run: |
          # The first attempt's leftovers: its npm parent, then apt and dpkg.
          pkill -f 'playwright install-deps' || true
          sudo pkill -TERM -x apt-get || true
          sudo pkill -TERM -x apt || true
          for _ in $(seq 1 30); do
            pgrep -x 'apt-get|apt|dpkg' > /dev/null || break
            sleep 2
          done
          sudo pkill -KILL -x 'apt-get|apt|dpkg' || true
          sudo dpkg --configure -a
          npx playwright install-deps chromium
      - name: Run the ${{ inputs.tier }} tier
        env:
          CI: 'true'
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            make e2e-ci E2E_ARGS="--grep $GREP"
          else
            make e2e-ci
          fi
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ inputs.tier }}-test-results
          path: web/test-results/
          retention-days: 7
