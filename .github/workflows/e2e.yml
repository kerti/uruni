# E2E (ADR-039): the @smoke journeys gate every PR and every push to main; the
# full suite runs on a weekday schedule. Both call one runner, e2e-run.yml.
#
# Both jobs are named `E2E`, with mutually exclusive `if:`s, so whichever runs
# reports the one stable check name branch protection requires:
# `E2E / Playwright`. A failed scheduled run opens (or comments on) one tracking
# issue, so a red nightly is not just an email.
name: E2E

on:
    # No branches filter, as in ci.yml: a PR into an epic branch is checked too.
  pull_request:
  push:
    branches: [main]
  schedule:
    # 19:00 UTC Monday-Friday is 02:00 the next morning in Jakarta.
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: E2E
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/e2e-run.yml
    with:
      tier: smoke
      grep: '@smoke'

  full:
    name: E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e-run.yml
    with:
      tier: full

  # One open issue per streak of failures: comment on it, or open it.
  nightly-failed:
    name: Report nightly failure
    needs: full
    if: ${{ always() && github.event_name == 'schedule' && needs.full.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Nightly e2e is failing
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled full e2e suite failed: $RUN_URL"
          fi
