# Build and publish the release container image to GHCR on a version tag.
# Build-once / promote-many: the image ghcr.io/<owner>/uruni:<tag> exists for every
# tag ever cut. Deploying that image to the maintainer's instance is a separate,
# manual ops step kept out of this repo (see docs/ADR/, ADR-016/017).
name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/uruni
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # amd64 for typical VPS hosts, arm64 for the Pi / Ampere boxes a
          # self-hoster is just as likely to have (ADR-010: compose is the
          # make-or-break deployment UX).
          platforms: linux/amd64,linux/arm64
          # Without these the image reports `dev (commit unknown)` forever — and
          # ADR-019 makes `uruni version` the operator's half of the upgrade
          # contract. COMMIT is passed explicitly because .dockerignore keeps
          # .git out of the build context, so Go cannot stamp it itself.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
