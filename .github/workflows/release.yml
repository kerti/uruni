# Build and publish the release container image to GHCR on a version tag.
# Build-once / promote-many: the image ghcr.io/<owner>/uruni:<tag> exists for every
# tag ever cut. Deploying that image to the maintainer's instance is a separate,
# manual ops step kept out of this repo (see docs/ADR/, ADR-016/017).
name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # "Never tag a red main", enforced: the tag must sit on main and main's required
  # checks must already be green on that exact commit. One read, no waiting - a
  # check still running means the tag was pushed too early.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from main"
            exit 1
          fi
      - name: Required checks are green
        env:
          GH_TOKEN: ${{ github.token }}
          # Mirrors main's branch protection (GITHUB_TOKEN cannot read it). The
          # "CodeQL" context is not a check run of this repo's workflows, so its two
          # Analyze runs (codeql.yml) stand in for it.
          REQUIRED: |
            Backend (lint + test)
            Frontend (lint + typecheck + test + build)
            E2E / Playwright
            scan
            Analyze (go)
            Analyze (javascript-typescript)
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | [.id, .name, (.conclusion // .status)] | @tsv' > runs.tsv
          failed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            # A re-run has a higher id; the latest run of a name decides.
            result=$(awk -F'\t' -v n="$name" '$2 == n && $1 > id { id = $1; r = $3 } END { print r }' runs.tsv)
            if [ "$result" != "success" ]; then
              echo "::error::required check \"$name\" is ${result:-missing} on $GITHUB_SHA"
              failed=1
            fi
          done <<< "$REQUIRED"
          exit "$failed"

  # The full suite, not just @smoke, before an image exists to pull.
  e2e:
    needs: verify
    uses: ./.github/workflows/e2e-run.yml
    with:
      tier: full

  image:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/uruni
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
                    # amd64 for typical VPS hosts, arm64 for the Pi / Ampere boxes a
                    # self-hoster is as likely to have (ADR-010: compose is the
                    # make-or-break deployment UX).
          platforms: linux/amd64,linux/arm64
                    # Without these the image reports `dev (commit unknown)` forever, and
                    # ADR-019 makes `uruni version` the operator's half of the upgrade
                    # contract. COMMIT is passed explicitly because .dockerignore keeps .git
                    # out of the build context, so Go cannot stamp it itself.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
